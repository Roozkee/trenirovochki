<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Тренировки</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181c;--ink2:#555b65;--muted:#868c95;--line:#e2e5ea;--input:#eef0f3;
  --accent:#2563eb;--accent-ink:#fff;--accent-soft:#e3ecfd;
  --good:#157f3b;--good-soft:#e3f3e8;--warn:#a35400;--warn-soft:#fcefdc;--bad:#b42318;--bad-soft:#fde7e5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1013;--card:#191c21;--ink:#eceef1;--ink2:#a7adb6;--muted:#7a818b;--line:#2a2e35;--input:#23272d;
  --accent:#6b9bff;--accent-ink:#0b1430;--accent-soft:#1b2944;
  --good:#5bd389;--good-soft:#14281c;--warn:#f0a44a;--warn-soft:#2c2112;--bad:#ff8a80;--bad-soft:#321a19;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:10px 16px 28px}
h1{font-size:26px;margin:10px 0 14px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:16px;margin:0;line-height:1.3}
p{margin:0 0 8px}
button,select,input,textarea{font:inherit;touch-action:manipulation}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.sub{color:var(--ink2);font-size:14px}
.muted{color:var(--muted);font-size:13px}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:10px}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--input);color:var(--ink);min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{display:block;width:100%}
.btn.ghost{background:transparent;color:var(--accent);padding-left:4px;padding-right:4px}
.btn.danger{background:transparent;color:var(--bad)}
.btn:disabled{opacity:.45}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:44px;font-weight:600;font-size:15px}
.seg{display:flex;background:var(--input);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--ink2);border-radius:8px;min-height:36px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hint{border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;background:var(--input);color:var(--ink)}
.hint.good{background:var(--good-soft);color:var(--good)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.hint.bad{background:var(--bad-soft);color:var(--bad)}
.note{background:var(--accent-soft);border-color:transparent}
.field{display:block;width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--ink);padding:0 10px;font-size:16px}
textarea.field{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
select.field{-webkit-appearance:none;appearance:none}
.list-item{display:block;width:100%;text-align:left;appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num-c,th.num-c{text-align:right;white-space:nowrap}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{border-radius:10px;padding:6px 0;font-size:13px}
.wd .d{font-weight:600;font-size:15px}
.wd .t{font-size:11px;color:var(--ink2);min-height:15px}
.wd.today{outline:2px solid var(--accent)}
.wd.done{background:var(--good-soft)}
.wd.done .t{color:var(--good);font-weight:700}
/* workout */
.wk-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0;margin:-10px 0 6px}
.wk-head .ttl{flex:1;min-width:0}
.wk-head .ttl b{display:block;font-size:19px}
.wk-date{border:0;background:none;color:var(--ink2);font-size:14px;padding:0;height:auto}
.ex-top{display:flex;justify-content:space-between;gap:10px}
.vid{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap;padding-top:2px}
.last{font-size:13px;color:var(--ink2);margin-top:6px}
.sets-head,.set{display:grid;grid-template-columns:22px 1fr 1fr 64px 34px;gap:6px;align-items:center}
.sets-head{font-size:12px;color:var(--muted);margin:12px 0 4px;text-align:center}
.set{margin-bottom:6px}
.set .n{color:var(--muted);font-size:14px;text-align:center}
.num,.rir{width:100%;height:46px;border-radius:10px;border:1px solid transparent;background:var(--input);color:var(--ink);font-size:18px;text-align:center;padding:0 2px;-webkit-appearance:none;appearance:none;text-align-last:center}
.num:focus,.rir:focus{outline:none;border-color:var(--accent)}
.num::placeholder{color:var(--muted);font-size:14px}
.same{grid-column:2 / 5;height:46px;border-radius:10px;border:1.5px dashed var(--line);background:none;color:var(--accent);font-weight:600;font-size:15px}
.same:disabled{color:var(--muted)}
.mini{appearance:none;width:34px;height:46px;border:0;background:none;color:var(--muted);font-size:19px;padding:0}
.ex-foot{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.ex-foot .pain{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-left:auto}
.ex-foot .pain select{width:62px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--input);color:var(--ink);font-size:16px;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.ex.flag{border-color:var(--bad)}
/* chart */
.chart{position:relative;width:100%;min-height:190px;margin-top:6px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis-t{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .band{fill:var(--good-soft)}
.chart .band-ln{stroke:var(--good);stroke-width:1;stroke-dasharray:3 3;fill:none;opacity:.7}
.chart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);display:none}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* tabs */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{appearance:none;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav#tabs button.on{color:var(--accent)}
nav#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Сегодня</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Журнал</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Прогресс</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Данные</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ====================== ПРОГРАММА (менять здесь при изменении program.md) ====================== */
const APP_VERSION = '1.0.0';
const PROGRAM_START = '2026-11-09'; // понедельник первой недели занятий, для номера недели
const SCHEDULE = {1:'UA', 2:'LA', 4:'UB', 5:'LB'}; // день недели (пн=1) -> тренировка

const PHASES = [
  {from:'2026-11-07', to:'2026-11-22', name:'Фаза 1', sub:'вход в режим', rir:'3'},
  {from:'2026-11-23', to:'2026-12-06', name:'Фаза 2', sub:'адаптация связок', cap:3, rir:'2-3'},
  {from:'2026-12-07', to:'2027-01-03', name:'Фаза 2', sub:'полный объём', rir:'2'},
  {from:'2027-01-04', to:'2027-01-10', name:'Разгрузка', sub:'половина подходов, те же веса', deload:true, rir:'3'},
  {from:'2027-01-11', to:null,        name:'Фаза 3', sub:'двойная прогрессия', rir:'1-2'},
];

// load: db (гантели, по умолчанию), band (резинка), bw (свой вес). max: предел веса в кг для подсказок.
const DAYS = {
  UA:{name:'Верх A', short:'ВA', group:'upper', ex:[
    {id:'floor_press',  name:'Жим гантелей лёжа на полу', sets:4, lo:6, hi:10, unit:'кг на гантель', q:'dumbbell floor press'},
    {id:'row1',         name:'Тяга гантели одной рукой с опорой', sets:4, lo:8, hi:12, unit:'кг', q:'one arm dumbbell row'},
    {id:'seated_press', name:'Жим гантелей сидя на стуле', sets:3, lo:8, hi:12, unit:'кг на гантель', q:'seated dumbbell shoulder press'},
    {id:'lateral',      name:'Разведение гантелей в стороны', sets:3, lo:12, hi:20, unit:'кг на гантель', q:'dumbbell lateral raise form'},
    {id:'curl',         name:'Сгибание рук на бицепс', sets:3, lo:8, hi:12, unit:'кг на гантель', q:'dumbbell bicep curl form'},
    {id:'french',       name:'Французский жим из-за головы', sets:3, lo:10, hi:15, unit:'кг', max:40, q:'overhead dumbbell triceps extension'},
  ]},
  LA:{name:'Низ A', short:'НA', group:'lower', ex:[
    {id:'bulgarian',    name:'Болгарские сплит-приседания', note:'задняя нога на стуле, повторы на каждую ногу', sets:4, lo:8, hi:12, unit:'кг на гантель', q:'Bulgarian split squat form'},
    {id:'rdl',          name:'Румынская тяга с гантелями', sets:4, lo:8, hi:12, unit:'кг на гантель', q:'dumbbell Romanian deadlift form'},
    {id:'glute_bridge', name:'Ягодичный мостик на полу с гантелью', sets:3, lo:10, hi:15, unit:'кг', max:40, q:'dumbbell glute bridge'},
    {id:'calf1',        name:'Подъёмы на носки на одной ноге', sets:4, lo:12, hi:20, unit:'кг', q:'single leg calf raise dumbbell'},
    {id:'core',         name:'Скручивания или планка', note:'повторы или секунды, без подсказок по весу', sets:3, lo:null, hi:null, unit:'кг, можно пусто', load:'bw', q:'plank form'},
  ]},
  UB:{name:'Верх B', short:'ВB', group:'upper', ex:[
    {id:'pushup',        name:'Отжимания с ногами на стуле', note:'резинка на спине для утяжеления', sets:4, lo:8, hi:15, unit:'доп. кг, можно пусто', load:'bw', q:'feet elevated push up'},
    {id:'row2',          name:'Тяга двумя гантелями в наклоне', sets:4, lo:8, hi:12, unit:'кг на гантель', q:'bent over dumbbell row'},
    {id:'arnold',        name:'Жим Арнольда', sets:3, lo:8, hi:12, unit:'кг на гантель', q:'Arnold press'},
    {id:'band_pulldown', name:'Тяга резинки сверху вниз', sets:3, lo:12, hi:15, unit:'кг резинки, можно пусто', load:'band', q:'kneeling band lat pulldown'},
    {id:'face_pull',     name:'Тяга резинки к лицу', sets:3, lo:15, hi:20, unit:'кг резинки, можно пусто', load:'band', q:'band face pull'},
    {id:'hammer',        name:'Молотковые сгибания', sets:3, lo:8, hi:12, unit:'кг на гантель', q:'hammer curl dumbbell'},
    {id:'band_pushdown', name:'Разгибания рук с резинкой', sets:3, lo:12, hi:20, unit:'кг резинки, можно пусто', load:'band', q:'band triceps pushdown'},
    {id:'pullover',      name:'Пуловер с гантелью на полу', sets:3, lo:10, hi:15, unit:'кг', max:40, q:'dumbbell pullover on floor'},
  ]},
  LB:{name:'Низ B', short:'НB', group:'lower', ex:[
    {id:'goblet',        name:'Гоблет-приседания с паузой', note:'пауза внизу, медленный спуск', sets:4, lo:10, hi:15, unit:'кг', max:40, q:'goblet squat form'},
    {id:'reverse_lunge', name:'Выпады назад', note:'повторы на каждую ногу', sets:3, lo:10, hi:12, unit:'кг на гантель', q:'dumbbell reverse lunge'},
    {id:'sl_rdl',        name:'Односторонняя румынская тяга', sets:3, lo:8, hi:12, unit:'кг', q:'single leg romanian deadlift dumbbell'},
    {id:'leg_curl',      name:'Сгибание ног с резинкой или гантелью', sets:3, lo:12, hi:15, unit:'кг, можно пусто', q:'band hamstring curl'},
    {id:'calf',          name:'Подъёмы на носки', sets:4, lo:15, hi:20, unit:'кг на гантель', q:'dumbbell calf raise'},
  ]},
};
const DB_MAX = 20; // около 20 кг на руку
/* ============================================================================================ */

const EX = {};
for (const [k, d] of Object.entries(DAYS)) d.ex.forEach(e => { EX[e.id] = Object.assign({day:k}, e); });
const GROUP_NAME = {upper:'Верх', lower:'Низ'};

/* ---------- даты и форматирование ---------- */
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => toStr(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return toStr(d); };
const dnum = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; };
const diffDays = (a, b) => Math.round(dnum(a) - dnum(b));
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtDate = s => { const d = parse(s); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`; };
const fmtDateW = s => `${WD[parse(s).getDay()]} ${fmtDate(s)}`;
const fmtLong = s => { const d = parse(s); return `${WDL[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtNum = n => (n == null || n === '') ? '' : String(Math.round(n*100)/100).replace('.', ',');
const parseNum = v => { if (v == null) return null; v = String(v).replace(',', '.').trim(); if (v === '') return null; const n = parseFloat(v); return isFinite(n) ? n : null; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few; return many; };
const $ = sel => document.querySelector(sel);

/* ---------- хранение ---------- */
const KEY = 'hw.v1';
const blank = () => ({v:1, workouts:[], weights:[], lastExport:null});
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
let S = load();
let saveTimer = null;
function save() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast('Не удалось сохранить данные на телефоне'); return false; }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) save(); });
window.addEventListener('pagehide', () => { if (saveTimer) save(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- логика программы ---------- */
const phaseOf = date => PHASES.find(p => date >= p.from && (!p.to || date <= p.to)) || (date < PHASES[0].from ? PHASES[0] : PHASES[PHASES.length-1]);
const nextPhase = date => PHASES.find(p => p.from > date);
const weekNo = date => Math.floor(diffDays(date, PROGRAM_START) / 7) + 1;
function targetSets(ex, date) {
  const p = phaseOf(date);
  if (p.deload) return Math.max(1, Math.ceil(ex.sets / 2));
  if (p.cap) return Math.min(ex.sets, p.cap);
  return ex.sets;
}
function deloadReminder(date) {
  const p = phaseOf(date);
  if (p !== PHASES[PHASES.length-1]) return '';
  const lastDel = [...PHASES].reverse().find(x => x.deload);
  if (!lastDel) return '';
  const weeks = Math.floor(diffDays(date, lastDel.to) / 7);
  return weeks >= 6 ? `С прошлой разгрузки прошло ${weeks} ${plural(weeks,'неделя','недели','недель')}. Пора запланировать разгрузочную неделю, попросите Claude обновить календарь.` : '';
}

const isFilled = s => s && s.r != null;
const sortedDesc = () => [...S.workouts].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created||0) - (a.created||0));
function sessions(exId, date, exclId) {
  const out = [];
  for (const w of sortedDesc()) {
    if (w.id === exclId || w.date > date) continue;
    const e = w.ex.find(x => x.id === exId);
    if (!e) continue;
    const sets = e.sets.filter(isFilled);
    if (!sets.length) continue;
    out.push({date:w.date, sets, pain:e.pain||0, note:e.note||'', wid:w.id});
  }
  return out;
}
const maxW = sets => Math.max(0, ...sets.map(s => s.w || 0));
const sumR = sets => sets.reduce((a, s) => a + (s.r || 0), 0);
const volume = sets => sets.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0);
function setsStr(sets) {
  if (!sets.length) return '';
  const ws = sets.map(s => s.w || 0);
  if (ws.every(x => x === ws[0])) return (ws[0] ? fmtNum(ws[0]) + ' кг × ' : '× ') + sets.map(s => s.r).join(', ');

  const wEl = document.querySelector('[data-chart="weight"]');
  if (wEl) {
    const ws = [...S.weights].sort((a, b) => a.date < b.date ? -1 : 1);
    const pts = ws.map(w => ({d:w.date, y:w.kg, label:`${fmtDateW(w.date)}: ${fmtNum(w.kg)} кг`}));
    let band = null;
    if (ws.length) { const f = ws[0]; band = {d0:f.date, y0:f.kg, until:Math.max(dnum(ws[ws.length-1].date), dnum(f.date) + 28)}; }
    drawChart(wEl, pts, {band, unit:'кг'});
  }
  const eEl = document.querySelector('[data-chart="ex"]');
  if (eEl) {
    const m = METRICS[progMetric];
    const pts = sessions(progEx, '9999-12-31', null).reverse().map(s => ({d:s.date, y:m.f(s.sets), label:`${fmtDateW(s.date)}: ${fmtNum(m.f(s.sets))} ${m.unit}`}));
    drawChart(eEl, pts, {unit:m.unit});
  }
}
function niceStep(x) { const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function drawChart(el, pts, opt) {
  if (!pts.length) { el.innerHTML = '<div class="empty">Пока нет данных</div>'; return; }
  const W = Math.max(260, el.clientWidth), H = 190, L = 40, R = 14, T = 12, B = 26;
  const xs = pts.map(p => dnum(p.d));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = pts.map(p => p.y);
  let bandPoly = null;
  if (opt.band) {
    const b = opt.band, bx0 = dnum(b.d0), bx1 = b.until, wk = (bx1 - bx0) / 7;
    x0 = Math.min(x0, bx0); x1 = Math.max(x1, bx1);
    bandPoly = [[bx0, b.y0], [bx1, b.y0 + 0.25*wk], [bx1, b.y0 + 0.4*wk], [bx0, b.y0]];
    ys.push(b.y0 + 0.4*wk);
  }
  if (x1 - x0 < 6) { x0 -= 3; x1 += 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  const step = niceStep((y1 - y0) / 3);
  y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  if (y0 < 0 && Math.min(...pts.map(p => p.y)) >= 0) y0 = 0;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="График">`;
  for (let v = y0; v <= y1 + step/2; v += step) s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis-t" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(Math.round(v*100)/100)}</text>`;
  const toD = v => { const d = new Date(v * 864e5); return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth()+1)}`; };
  s += `<text class="axis-t" x="${L}" y="${H-6}">${toD(x0)}</text><text class="axis-t" x="${W-R}" y="${H-6}" text-anchor="end">${toD(x1)}</text>`;
  if (bandPoly) {
    const [a, b, c, d] = bandPoly;
    s += `<polygon class="band" points="${X(a[0])},${Y(a[1])} ${X(b[0])},${Y(b[1])} ${X(c[0])},${Y(c[1])}"/>`;
    s += `<line class="band-ln" x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}"/><line class="band-ln" x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}"/>`;
  }
  if (pts.length > 1) s += `<path class="ln" d="${pts.map((p, i) => (i ? 'L' : 'M') + X(dnum(p.d)).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('')}"/>`;
  s += pts.map(p => `<circle class="pt" r="4.5" cx="${X(dnum(p.d))}" cy="${Y(p.y)}"/>`).join('');
  s += `<line class="xh" y1="${T}" y2="${H-B}" x1="0" x2="0" visibility="hidden"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const dd = Math.abs(X(dnum(p.d)) - px); if (dd < bd) { bd = dd; best = p; } }
    const cx = X(dnum(best.d));
    xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("visibility", "visible");
    tip.textContent = best.label; tip.style.display = 'block';
    const half = tip.offsetWidth / 2, left = Math.min(Math.max(cx * r.width / W, half), r.width - half);
    tip.style.left = left + 'px'; tip.style.top = '-30px';
  };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerleave', () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); });
}

/* ---------- данные ---------- */
function vData() {
  let h = `<h1>Данные</h1>
  <div class="card"><h2>Резервная копия</h2>
    <div class="sub">Записи хранятся только на этом телефоне, внутри иконки приложения. Если удалить иконку, записи пропадут. ${S.lastExport ? `Последняя копия: ${fmtDateW(S.lastExport)}.` : 'Копия ещё не делалась.'}</div>
    <button class="btn primary block mt" data-act="export">Сохранить файл</button>
    <div class="muted mt">Откроется меню «Поделиться»: сохраните в «Файлы» или отправьте себе в мессенджер.</div>
    <button class="btn block mt" data-act="import">Загрузить из файла</button>
    <div class="muted mt">Записи из файла добавятся к текущим, совпадающие обновятся.</div></div>
  <div class="card"><h2>Для разбора с Claude</h2>
    <div class="sub">Текст журнала, который можно вставить в чат.</div>
    <div class="seg mt">${[[14,'2 недели'],[28,'4 недели'],[0,'Всё']].map(([d, l]) => `<button data-act="cdays" data-d="${d}" class="${claudeDays === d ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn primary block mt" data-act="copy">Скопировать текст</button>
    <textarea class="field mt" id="cltext" rows="6" readonly hidden></textarea></div>
  <div class="card"><h2>Календарь</h2><table><tr><th>Период</th><th>Этап</th></tr>
    ${PHASES.map(p => `<tr><td>${fmtDate(p.from)}${p.to ? '-' + fmtDate(p.to) : ' и далее'}</td><td>${p.name}: ${p.sub}</td></tr>`).join('')}</table>
    <div class="sub mt">Неделя: пн Верх A, вт Низ A, чт Верх B, пт Низ B. Среда и выходные отдыхаем.</div></div>
  <div class="muted" style="text-align:center">Версия ${APP_VERSION}</div>`;
  return h;
}
function claudeText(days) {
  const t = today(), from = days ? addDays(t, -days + 1) : '0000-00-00';
  const L = [`Журнал тренировок, выгрузка ${fmtDate(t)}${days ? `, последние ${days} дней` : ', всё время'}.`];
  const p = phaseOf(t);
  L.push(`Сейчас: ${p.name}, ${p.sub}, неделя ${weekNo(t)}.`);
  const ws = [...S.weights].sort((a, b) => a.date < b.date ? -1 : 1);
  const wIn = ws.filter(w => w.date >= from);
  const before = ws.filter(w => w.date < from).pop();
  const wl = (before ? [before] : []).concat(wIn);
  L.push(wl.length ? 'Вес тела: ' + wl.map(w => `${fmtDate(w.date)} ${fmtNum(w.kg)} кг`).join(', ') + '.' : 'Вес тела: нет записей.');
  L.push('');
  const list = [...S.workouts].filter(w => w.date >= from).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created||0) - (b.created||0));
  if (!list.length) L.push('Тренировок за период нет.');
  for (const w of list) {
    L.push(`${fmtDateW(w.date)}, ${DAYS[w.day].name}${w.status === 'draft' ? ' (не завершена)' : ''}`);
    for (const e of w.ex) {
      const fs = e.sets.filter(isFilled);
      if (!fs.length) { L.push(`- ${EX[e.id].name}: не выполнялось`); continue; }
      const st = fs.map(s => `${s.w ? fmtNum(s.w) + ' кг ' : ''}×${s.r}${s.rir != null ? ' (запас ' + s.rir + ')' : ''}`).join(', ');
      L.push(`- ${EX[e.id].name}: ${st}${e.pain ? `, суставы ${e.pain}/10` : ''}${e.note ? `, заметка: ${e.note}` : ''}`);
    }
    L.push('');
  }
  return L.join('\n').trim();
}
async function exportFile() {
  const data = JSON.stringify(Object.assign({app:'home-workout', appVersion:APP_VERSION, exported:new Date().toISOString()}, S, {lastExport:today()}));
  const name = `trenirovki-${today()}.json`;
  let file;
  try { file = new File([data], name, {type:'application/json'}); } catch (e) { file = new Blob([data], {type:'application/json'}); }
  try {
    if (navigator.canShare && file instanceof File && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:name});
      S.lastExport = today(); save(); render(); toast('Копия сохранена'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  S.lastExport = today(); save(); render(); toast('Файл сохранён');
}
function importData(obj) {
  if (!obj || !Array.isArray(obj.workouts)) throw new Error('bad');
  let added = 0, updated = 0;
  for (const w of obj.workouts) {
    if (!w || !w.id || !DAYS[w.day] || !Array.isArray(w.ex)) continue;
    const ex = getW(w.id);
    if (!ex) { S.workouts.push(w); added++; }
    else if ((w.updated || 0) > (ex.updated || 0)) { Object.assign(ex, w); updated++; }
  }
  for (const x of (obj.weights || [])) if (x && x.date && typeof x.kg === 'number' && !S.weights.some(y => y.date === x.date)) S.weights.push(x);
  save();
  toast(`Загружено: новых ${added}, обновлено ${updated}`);
}
function addWeight(date, val) {
  const kg = parseNum(val);
  if (kg == null || kg < 30 || kg > 200) { toast('Введите вес в килограммах, например 60,4'); return false; }
  S.weights = S.weights.filter(w => w.date !== date);
  S.weights.push({date, kg});
  save(); toast(`Записано: ${fmtNum(kg)} кг`);
  return true;
}

/* ---------- обработчики ---------- */
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const w = getW(curId);
  const card = t.closest('[data-ex]');
  const ei = card ? +card.dataset.ex : -1;
  switch (act) {
    case 'tab': go(t.dataset.tab); break;
    case 'open': go('workout', {id:t.dataset.id}); break;
    case 'start': case 'start-date': {
      const date = act === 'start' ? today() : ($('#logDate').value || today());
      const day = t.dataset.day;
      const existing = S.workouts.find(x => x.date === date && x.day === day);
      if (existing) { go('workout', {id:existing.id}); break; }
      const r = recentSameGroup(day, date, null);
      if (r && !confirm(`${GROUP_NAME[DAYS[day].group]} уже был ${r.d === 0 ? 'сегодня' : 'вчера'}. Мышцам нужно 48 часов. Всё равно начать?`)) break;
      go('workout', {id:newWorkout(day, date).id});
      break;
    }
    case 'back': save(); go(tab); break;
    case 'same': {
      const j = +t.dataset.s, prev = w.ex[ei].sets[j-1];
      w.ex[ei].sets[j] = {w:prev.w, r:prev.r, rir:prev.rir};
      touch(w); rerenderCard(ei); break;
    }
    case 'edit': {
      const j = +t.dataset.s; w.ex[ei].sets[j].edit = true; rerenderCard(ei);
      const inp = document.querySelector(`[data-ex="${ei}"] [data-f="w"][data-s="${j}"]`); if (inp) inp.focus();
      break;
    }
    case 'clr': {
      const j = +t.dataset.s, e2 = w.ex[ei], n = targetSets(EX[e2.id], w.date);
      if (j >= n) e2.sets.splice(j, 1); else e2.sets[j] = {w:null, r:null, rir:null};
      touch(w); rerenderCard(ei); break;
    }
    case 'addset': w.ex[ei].sets.push({w:null, r:null, rir:null}); touch(w); rerenderCard(ei); break;
    case 'note': w.ex[ei].showNote = true; rerenderCard(ei); { const ta = document.querySelector(`[data-ex="${ei}"] textarea`); if (ta) ta.focus(); } break;
    case 'finish': {
      const n = countSets(w);
      if (!n && !confirm('Ни одного подхода не записано. Всё равно завершить?')) break;
      w.status = 'done'; w.updated = Date.now(); save();
      toast(`Сохранено: ${n} ${plural(n,'подход','подхода','подходов')}`);
      go(tab); break;
    }
    case 'delworkout':
      if (confirm(`Удалить тренировку ${DAYS[w.day].name} за ${fmtDateW(w.date)}? Это нельзя отменить.`)) { S.workouts = S.workouts.filter(x => x.id !== w.id); save(); toast('Тренировка удалена'); go(tab); }
      break;
    case 'addweight-quick': if (addWeight(today(), $('#wq').value)) render(); break;
    case 'addweight': if (addWeight($('#wDate').value || today(), $('#wKg').value)) render(); break;
    case 'delweight': if (confirm(`Удалить взвешивание за ${fmtDateW(t.dataset.date)}?`)) { S.weights = S.weights.filter(x => x.date !== t.dataset.date); save(); render(); } break;
    case 'metric': progMetric = t.dataset.m; render(); break;
    case 'cdays': claudeDays = +t.dataset.d; render(); break;
    case 'copy': {
      const txt = claudeText(claudeDays);
      try { await navigator.clipboard.writeText(txt); toast('Скопировано. Вставьте в чат с Claude'); }
      catch (err) { const ta = $('#cltext'); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast('Выделите текст и скопируйте вручную'); }
      break;
    }
    case 'export': exportFile(); break;
    case 'import': $('#importFile').click(); break;
  }
});

function onField(e) {
  const t = e.target, f = t.dataset && t.dataset.f;
  if (!f) return;
  if (f === 'progEx') { progEx = t.value; progMetric = null; render(); return; }
  const w = getW(curId);
  if (!w) return;
  if (f === 'wdate') { if (e.type === 'change' && t.value) { w.date = t.value; touch(w); render(); } return; }
  const card = t.closest('[data-ex]'); if (!card) return;
  const ei = +card.dataset.ex, ex = w.ex[ei];
  if (f === 'pain') { const v = +t.value; if (ex.pain !== v) { ex.pain = v; touch(w); rerenderCard(ei); } return; }
  if (f === 'note') { ex.note = t.value; touch(w); return; }
  const s = ex.sets[+t.dataset.s];
  if (f === 'w') s.w = parseNum(t.value);
  else if (f === 'r') { const n = parseNum(t.value); s.r = n == null ? null : Math.max(0, Math.round(n)); }
  else if (f === 'rir') s.rir = t.value === '' ? null : +t.value;
  touch(w); refreshSame(card, ei);
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('num')) setTimeout(() => { try { e.target.select(); } catch (_) {} }, 0); });

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try { importData(JSON.parse(await f.text())); render(); }
  catch (err) { toast('Не удалось прочитать файл. Нужен файл, сохранённый этим приложением'); }
});

let lastDay = today();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); if (view !== 'workout') render(); } });
window.addEventListener('resize', () => { if (view === 'progress') drawProgressCharts(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
